name: Windows Cancellation Interleaving

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-interleaving:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - name: Prepare local path dependencies
        shell: bash
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - name: Run real-pipe cancellation probe
        timeout-minutes: 15
        shell: pwsh
        run: |
          $log = "windows-cancellation-interleaving.log"
          Set-Content -Path $log -Value "ci_checkout_sha=$env:GITHUB_SHA"
          Add-Content -Path $log -Value "platform=windows-2022"
          Add-Content -Path $log -Value "command=cargo test --lib windows_successful_cancel_interleaving -- --test-threads=1 --nocapture"
          $output = & cargo test --lib windows_successful_cancel_interleaving -- --test-threads=1 --nocapture 2>&1
          $cargoExitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $log -Append
          if ($cargoExitCode -ne 0) { exit $cargoExitCode }
          $summary = $output | Select-String -Pattern '^running ([0-9]+) tests?$' | Select-Object -First 1
          if ($null -eq $summary) {
            Add-Content -Path $log -Value "selected_test_count=unavailable"
            throw "Cargo test output did not contain a test-count summary"
          }
          $selectedTests = [int]$summary.Matches[0].Groups[1].Value
          Add-Content -Path $log -Value "selected_test_count=$selectedTests"
          if ($selectedTests -eq 0) { throw "Windows probe filter selected zero tests" }
      - name: Upload probe trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cancellation-interleaving-trace
          path: windows-cancellation-interleaving.log
          if-no-files-found: warn
