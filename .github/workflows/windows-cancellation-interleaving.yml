name: Windows Cancellation Interleaving

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      measure_performance:
        description: Run the Windows idle-output budget measurements (three samples)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-interleaving:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - name: Prepare local path dependencies
        shell: bash
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - name: Run identity gate fixtures
        shell: pwsh
        run: ./.github/scripts/assert-windows-probe-results.tests.ps1
      - name: Run and verify real-pipe cancellation probes
        timeout-minutes: 15
        shell: pwsh
        run: |
          $listLog = "windows-cancellation-interleaving-list.log"
          $runLog = "windows-cancellation-interleaving.log"
          $windowsRunLog = "windows-cancellation-interleaving-windows-run.log"
          $commandIoRunLog = "windows-cancellation-interleaving-command-io-run.log"
          $checkLog = "windows-cancellation-interleaving-check.log"
          Set-Content -Path $checkLog -Value "ci_checkout_sha=$env:GITHUB_SHA"
          Add-Content -Path $checkLog -Value "platform=windows-2022"
          Set-Content -Path $runLog -Value "ci_checkout_sha=$env:GITHUB_SHA"
          Add-Content -Path $runLog -Value "platform=windows-2022"
          Add-Content -Path $runLog -Value "list_command=cargo test --lib windows_ -- --list --color never"
          $listOutput = & cargo test --lib windows_ -- --list --color never 2>&1
          $listExitCode = $LASTEXITCODE
          $listOutput | Tee-Object -FilePath $listLog
          Add-Content -Path $runLog -Value "list_exit_code=$listExitCode"
          if ($listExitCode -ne 0) {
            Add-Content -Path $checkLog -Value "list_command_exit_code=$listExitCode"
            Add-Content -Path $checkLog -Value "list_command_failed=cargo test --lib windows_ -- --list --color never"
            throw "Cargo test listing failed with exit code $listExitCode"
          }

          $commandIoFilter = "command_io::tests::test_error_not_found_"
          $commandIoListCommand = "cargo test --lib $commandIoFilter -- --list --color never"
          Add-Content -Path $runLog -Value "list_command=$commandIoListCommand"
          $commandIoListOutput = & cargo test --lib $commandIoFilter -- --list --color never 2>&1
          $commandIoListExitCode = $LASTEXITCODE
          $commandIoListOutput | Tee-Object -FilePath $listLog -Append
          Add-Content -Path $runLog -Value "command_io_list_exit_code=$commandIoListExitCode"
          if ($commandIoListExitCode -ne 0) {
            Add-Content -Path $checkLog -Value "command_io_list_command_exit_code=$commandIoListExitCode"
            Add-Content -Path $checkLog -Value "command_io_list_command_failed=$commandIoListCommand"
            throw "Cargo command I/O test listing failed with exit code $commandIoListExitCode"
          }

          $command = "cargo test --lib windows_ -- --show-output --test-threads=1 --color never"
          Add-Content -Path $runLog -Value "command=$command"
          $output = & cargo test --lib windows_ -- --show-output --test-threads=1 --color never 2>&1
          $cargoExitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $windowsRunLog | Tee-Object -FilePath $runLog -Append
          Add-Content -Path $runLog -Value "cargo_exit_code=$cargoExitCode"
          if ($cargoExitCode -ne 0) {
            Add-Content -Path $checkLog -Value "run_command_exit_code=$cargoExitCode"
            Add-Content -Path $checkLog -Value "run_command_failed=$command"
            throw "Cargo test run failed with exit code $cargoExitCode"
          }
          $summary = $output | Select-String -Pattern '^running ([0-9]+) tests?$' | Select-Object -First 1
          if ($null -eq $summary) {
            Add-Content -Path $runLog -Value "selected_test_count=unavailable"
            Add-Content -Path $checkLog -Value "selected_test_count=unavailable"
            throw "Cargo test output did not contain a test-count summary"
          }
          $selectedTests = [int]$summary.Matches[0].Groups[1].Value
          if ($selectedTests -eq 0) {
            Add-Content -Path $runLog -Value "windows_selected_test_count=0"
            Add-Content -Path $checkLog -Value "windows_selected_test_count=0"
            throw "Windows probe filter selected zero tests"
          }
          Add-Content -Path $runLog -Value "windows_selected_test_count=$selectedTests"

          $commandIoRunCommand = "cargo test --lib $commandIoFilter -- --show-output --test-threads=1 --color never"
          Add-Content -Path $runLog -Value "command=$commandIoRunCommand"
          $commandIoOutput = & cargo test --lib $commandIoFilter -- --show-output --test-threads=1 --color never 2>&1
          $commandIoExitCode = $LASTEXITCODE
          $commandIoOutput | Tee-Object -FilePath $commandIoRunLog | Tee-Object -FilePath $runLog -Append
          Add-Content -Path $runLog -Value "command_io_cargo_exit_code=$commandIoExitCode"
          if ($commandIoExitCode -ne 0) {
            Add-Content -Path $checkLog -Value "command_io_run_exit_code=$commandIoExitCode"
            Add-Content -Path $checkLog -Value "command_io_run_failed=$commandIoRunCommand"
            throw "Cargo command I/O test run failed with exit code $commandIoExitCode"
          }
          $commandIoSummary = $commandIoOutput | Select-String -Pattern '^running ([0-9]+) tests?$' | Select-Object -First 1
          if ($null -eq $commandIoSummary) {
            Add-Content -Path $runLog -Value "command_io_selected_test_count=unavailable"
            Add-Content -Path $checkLog -Value "command_io_selected_test_count=unavailable"
            throw "Cargo command I/O test output did not contain a test-count summary"
          }
          $commandIoSelectedTests = [int]$commandIoSummary.Matches[0].Groups[1].Value
          Add-Content -Path $runLog -Value "command_io_selected_test_count=$commandIoSelectedTests"
          if ($commandIoSelectedTests -eq 0) {
            Add-Content -Path $checkLog -Value "command_io_selected_test_count=0"
            throw "Command I/O filter selected zero tests"
          }
          $totalSelectedTests = $selectedTests + $commandIoSelectedTests
          Add-Content -Path $runLog -Value "selected_test_count=$totalSelectedTests"
          Add-Content -Path $checkLog -Value "selected_test_count=$totalSelectedTests"

          Add-Content -Path $checkLog -Value "check_command=.github/scripts/assert-windows-probe-results.ps1 -ListPath $listLog -RunPath @($windowsRunLog, $commandIoRunLog)"
          try {
            & ./.github/scripts/assert-windows-probe-results.ps1 -ListPath $listLog -RunPath @($windowsRunLog, $commandIoRunLog) *>&1 | Tee-Object -FilePath $checkLog -Append
          }
          catch {
            Add-Content -Path $checkLog -Value ("check_failed=" + $_.ToString())
            throw
          }
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cancellation-interleaving-trace
          path: |
            windows-cancellation-interleaving-list.log
            windows-cancellation-interleaving.log
            windows-cancellation-interleaving-windows-run.log
            windows-cancellation-interleaving-command-io-run.log
            windows-cancellation-interleaving-check.log
          if-no-files-found: warn

  windows-output-budget-measurement:
    if: github.event_name == 'workflow_dispatch' && inputs.measure_performance
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - name: Prepare local path dependencies
        shell: bash
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - name: Build benchmark and record runner details
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path performance-results | Out-Null
          @(
            "checkout_sha=$env:GITHUB_SHA"
            "platform=$([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
            "architecture=$env:PROCESSOR_ARCHITECTURE"
            "processor_count=$([Environment]::ProcessorCount)"
            "rustc=$(& rustc --version --verbose | Out-String)"
            "cargo=$(& cargo --version)"
            "cpu=$((Get-CimInstance Win32_Processor | Select-Object -ExpandProperty Name) -join '; ')"
          ) | Set-Content performance-results/runner.txt
          cargo bench --bench command_runner --no-run 2>&1 | Tee-Object performance-results/build.log
          if ($LASTEXITCODE -ne 0) { throw "Benchmark build failed: $LASTEXITCODE" }
          $bench = Get-ChildItem target/release/deps/command_runner-*.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $bench) { throw "Cargo did not produce the command_runner benchmark executable" }
          "benchmark_executable=$($bench.FullName)" | Add-Content performance-results/runner.txt
          $bench.FullName | Set-Content performance-results/benchmark-executable.txt
      - name: Probe and attempt Windows ETW collection
        shell: pwsh
        run: |
          $log = "performance-results/etw-probe.log"
          "probe_time_utc=$([DateTime]::UtcNow.ToString('o'))" | Set-Content $log
          $wpr = Get-Command wpr.exe -ErrorAction SilentlyContinue
          $xperf = Get-Command xperf.exe -ErrorAction SilentlyContinue
          "wpr_path=$($wpr.Source)" | Add-Content $log
          "xperf_path=$($xperf.Source)" | Add-Content $log
          $script:WprStarted = $false
          $script:WprAvailable = $false
          if ($null -ne $wpr) {
            $profiles = & $wpr.Source -profiles 2>&1
            $profileExit = $LASTEXITCODE
            $profiles | Add-Content $log
            "wpr_profiles_exit_code=$profileExit" | Add-Content $log
            if ($profileExit -eq 0 -and (($profiles | Out-String) -match '(?m)^\s*CPU\s')) {
              "wpr_start_command=wpr -start CPU -filemode" | Add-Content $log
              $start = & $wpr.Source -start CPU -filemode 2>&1
              $startExit = $LASTEXITCODE
              $start | Add-Content $log
              "wpr_start_exit_code=$startExit" | Add-Content $log
              if ($startExit -eq 0) { $script:WprStarted = $true; $script:WprAvailable = $true }
            } else {
              "wpr_status=unavailable: CPU profile not listed or profile query failed" | Add-Content $log
            }
          } else {
            "wpr_status=unavailable: wpr.exe not found" | Add-Content $log
          }
          if (-not $script:WprStarted) { "etw_collection=unavailable" | Add-Content $log }
      - name: Run three isolated benchmark measurements
        shell: pwsh
        run: |
          $bench = Get-Content performance-results/benchmark-executable.txt -Raw
          $bench = $bench.Trim()
          $cpuLog = "performance-results/benchmark-process-cpu.txt"
          "cpu_attribution=TotalProcessorTime of the directly launched Criterion benchmark process; child fixture processes are separate and excluded" | Set-Content $cpuLog
          "criterion_version=0.8.2; --exact matches the complete group/function BenchmarkId; filter form: idle_output_budget/<case>" | Add-Content $cpuLog
          $cases = @(
            "silent_1_no_total_budget",
            "silent_1_total_budget_1024",
            "silent_8_no_total_budget",
            "silent_8_total_budget_1024",
            "intermittent_1_no_total_budget",
            "intermittent_1_total_budget_1024",
            "intermittent_8_no_total_budget",
            "intermittent_8_total_budget_1024"
          )
          foreach ($case in $cases) {
            $filter = "idle_output_budget/$case"
            for ($sample = 1; $sample -le 3; $sample++) {
              $stdout = "performance-results/$case-sample-$sample.stdout.log"
              $stderr = "performance-results/$case-sample-$sample.stderr.log"
              "case=$case exact_filter=$filter sample=$sample start_utc=$([DateTime]::UtcNow.ToString('o'))" | Add-Content $cpuLog
              $arguments = "$filter --bench --exact --sample-size 10 --warm-up-time 1 --measurement-time 2"
              "launch_command=`"$bench`" $arguments" | Add-Content $cpuLog
              $process = Start-Process -FilePath $bench -ArgumentList $arguments -PassThru -Wait -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              $process.Refresh()
              $cpuSeconds = $process.TotalProcessorTime.TotalSeconds
              "case=$case sample=$sample pid=$($process.Id) exit_code=$($process.ExitCode) benchmark_process_cpu_seconds=$cpuSeconds end_utc=$([DateTime]::UtcNow.ToString('o'))" | Add-Content $cpuLog
              if ($process.ExitCode -ne 0) { throw "Benchmark $filter sample $sample failed with exit code $($process.ExitCode)" }
              $benchmarkOutput = (Get-Content $stdout -Raw) + (Get-Content $stderr -Raw)
              if ($benchmarkOutput -notmatch [regex]::Escape($filter)) { throw "Criterion output did not confirm selected benchmark $filter" }
            }
          }
      - name: Stop ETW collection and record status
        if: always()
        shell: pwsh
        run: |
          $log = "performance-results/etw-probe.log"
          if (Test-Path $log) {
            $wpr = Get-Command wpr.exe -ErrorAction SilentlyContinue
            if ($null -ne $wpr -and (Get-Content $log -Raw) -match 'wpr_start_exit_code=0') {
              "wpr_stop_command=wpr -stop performance-results/output-budget.etl" | Add-Content $log
              $stop = & $wpr.Source -stop (Join-Path $PWD "performance-results/output-budget.etl") 2>&1
              $stopExit = $LASTEXITCODE
              $stop | Add-Content $log
              "wpr_stop_exit_code=$stopExit" | Add-Content $log
              if ($stopExit -eq 0) { "etw_collection=captured" | Add-Content $log }
              else { "etw_collection=unavailable: WPR stop failed" | Add-Content $log }
            }
          }
      - name: Analyze CPU samples and context switches
        if: always()
        shell: pwsh
        run: |
          $etl = "performance-results/output-budget.etl"
          $xperf = Get-Command xperf.exe -ErrorAction SilentlyContinue
          if ($null -eq $xperf -or -not (Test-Path $etl)) {
            "xperf_status=unavailable" | Add-Content performance-results/etw-probe.log
          } else {
            $cswitchOutput = "performance-results/context-switches.txt"
            "xperf_command=xperf -i $etl -a cswitch -o $cswitchOutput" | Add-Content performance-results/etw-probe.log
            & $xperf.Source -i $etl -a cswitch -o $cswitchOutput 2>&1 | Tee-Object -FilePath "performance-results/xperf-cswitch.log"
            $cswitchExit = $LASTEXITCODE
            "xperf_cswitch_exit_code=$cswitchExit" | Add-Content performance-results/etw-probe.log

            $profileOutput = "performance-results/sampled-cpu.txt"
            "xperf_command=xperf -i $etl -a profile -o $profileOutput" | Add-Content performance-results/etw-probe.log
            & $xperf.Source -i $etl -a profile -o $profileOutput 2>&1 | Tee-Object -FilePath "performance-results/xperf-profile.log"
            $profileExit = $LASTEXITCODE
            "xperf_profile_exit_code=$profileExit" | Add-Content performance-results/etw-probe.log
          }
      - name: Upload Windows performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-output-budget-performance-${{ github.run_id }}
          path: |
            performance-results/
            target/criterion/
          if-no-files-found: warn
